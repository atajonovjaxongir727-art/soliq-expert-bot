services:
  - type: web
    name: soliq-expert-bot
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build && npx tsx src/database/seed.ts
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin123password
